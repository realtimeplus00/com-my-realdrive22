<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>지도 운전 게임</title>

<!-- MapLibre GL JS: 지도를 그려주는 오픈소스 라이브러리 (CDN) -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- turf.js: 위치와 도로 선(line) 사이의 실제 거리(미터)를 계산하기 위한 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<style>
  /* ===== 기본 레이아웃 ===== */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: none; /* 스크롤/확대 등 브라우저 기본 제스처 방지 */
    -webkit-user-select: none;
    user-select: none;
  }

  #map {
    position: fixed;
    inset: 0;
    opacity: 0; /* 처음엔 안 보이다가, 위치를 찾으면 서서히 나타남 */
    transition: opacity 1.8s ease;
  }
  #map.revealed { opacity: 1; }

  /* ===== 화면 정중앙 자동차 ===== */
  #car {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 24px;
    margin-top: -12px;
    margin-left: -7px;
    z-index: 500;
    pointer-events: none;
    transform: rotate(0deg);
    transition: transform 0.05s linear;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
  }
  #car svg { width: 100%; height: 100%; display: block; }

  /* ===== 오른쪽 아래: 원형 핸들(투명 원) - 중심 기준 각도로 방향을 직접 조작 ===== */
  #wheel-zone {
    position: fixed;
    right: 18px;
    bottom: 24px;
    width: 168px;
    height: 168px;
    z-index: 450;
    touch-action: none;
  }
  #wheel-circle {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.55);
    background: rgba(20,33,61,0.30);
    box-sizing: border-box;
  }
  /* 위쪽(정면/0도)을 표시하는 작은 기준 눈금 */
  #wheel-circle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 6px;
    width: 3px;
    height: 12px;
    margin-left: -1.5px;
    background: rgba(255,255,255,0.6);
    border-radius: 2px;
  }
  #wheel-center-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
  }
  /* 현재 자동차 방향을 가리키는 바늘(needle): 자동차 아이콘과 항상 같은 각도로 회전 */
  #wheel-needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 44%;
    margin-left: -3px;
    background: #ffd166;
    border-radius: 4px;
    transform-origin: 50% 100%;
    transform: translateY(-100%) rotate(0deg);
  }

  /* ===== 왼쪽 아래: 전진 / 멈춤 / 후진 버튼 ===== */
  #controls {
    position: fixed;
    left: 14px;
    bottom: 22px;
    z-index: 600;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .ctrl-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active { filter: brightness(1.25); }
  #btn-forward { background: #2a7f62; }
  #btn-stop    { background: #8a2c2c; }
  #btn-reverse { background: #2c4d8a; }
  .ctrl-btn.active-state {
    outline: 2px solid #ffd166;
    outline-offset: 2px;
  }

  /* ===== 전진 버튼 오른쪽: 최고속도 +/- 버튼 ===== */
  #speed-controls {
    position: fixed;
    left: 61px;
    bottom: 69px;
    z-index: 600;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .speed-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    background: #6b4fa0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .speed-btn:active { filter: brightness(1.25); }

  /* ===== 상단 정보 표시줄 (점수계 + 속도계를 나란히 배치) ===== */
  #hud-row {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #hud, #score-hud {
    background: rgba(13,17,23,0.72);
    color: #eaeaea;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
  }
  #score-hud {
    color: #ffd166; /* 속도계와 구분되도록 점수는 살짝 강조 색상 */
  }

  /* 속도 표시 바로 아래의 일시정지 버튼 */
  #pause-btn {
    position: fixed;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 650; /* 도로 이탈/체포 경고 배지보다 위에 오도록 */
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(13,17,23,0.72);
    color: #eaeaea;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  #pause-btn:active { filter: brightness(1.3); }
  #pause-btn.is-paused {
    background: rgba(42,127,98,0.9); /* 다시 재생할 수 있음을 알리는 초록색 */
  }

  #offroad-warning {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 600;
    background: rgba(200,40,40,0.85);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }

  /* ===== 경찰차 & 추격(경찰과 도둑) 관련 ===== */
  #police-layer {
    position: fixed;
    inset: 0;
    z-index: 480; /* 플레이어 차(500)보다는 아래, 지도(맵)보다는 위 */
    pointer-events: none;
  }
  .police-car {
    position: absolute;
    width: 14px;
    height: 24px;
    left: 0;
    top: 0;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
  }
  .police-car svg { width: 100%; height: 100%; display: block; }
  /* 경광등 깜빡임: 빨강 ↔ 파랑 교차 */
  .police-light {
    animation: police-blink 0.5s steps(1) infinite;
  }
  @keyframes police-blink {
    0%, 49%   { fill: #ff3b3b; }
    50%, 100% { fill: #3b7bff; }
  }
  /* 경찰차 주변의 큰 원: 순찰 중엔 탐지 범위(초록 테두리만), 추격 중엔 체포 판정 범위(빨강 채움) */
  .catch-circle {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    box-sizing: border-box;
    pointer-events: none;
  }
  .catch-circle.mode-patrol {
    background: transparent;               /* 요청대로 안쪽에는 색을 넣지 않음 */
    border: 3px solid rgba(90, 255, 160, 0.95); /* 선만 초록색으로 - 숲 등 초록 배경에 묻히지 않도록 더 밝고 두껍게 */
  }
  .catch-circle.mode-chase {
    background: rgba(255,40,40,0.16);
    border: 2px solid rgba(255,60,60,0.55);
  }

  #catch-warning {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 601;
    background: rgba(180,20,20,0.9);
    color: #fff;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }

  #detected-warning {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 602;
    background: rgba(210,30,30,0.95);
    color: #fff;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    display: none;
    animation: detected-flash 0.35s steps(1) infinite;
  }
  @keyframes detected-flash {
    0%, 49%   { background: rgba(210,30,30,0.95); }
    50%, 100% { background: rgba(140,10,10,0.95); }
  }

  #caught-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(13,17,23,0.92);
    color: #eaeaea;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  #caught-overlay h1 { font-size: 22px; margin-bottom: 10px; color: #ff5a5f; }
  #caught-overlay p { font-size: 14px; color: #a9b1bb; margin: 4px 0 26px; }
  #caught-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 280px;
  }
  #caught-buttons button {
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
  }
  #restart-here-btn  { background: #2a7f62; } /* 현재(붙잡힌) 위치에서 바로 시작 - 주 액션 */
  #restart-start-btn { background: #2a5f8f; } /* 처음 시작 위치로 바로 시작 */
  #restart-main-btn  { background: #4a4f58; } /* 메인 화면(권한 화면)으로 이동 */

  /* 게임 시작 시 "어느 나라/도시에서 출발했는지" 크게 보여주는 배너 */
  #location-banner {
    position: fixed;
    top: 26%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 630; /* 카운트다운(620)보다 위, 체포 오버레이(1000)보다는 아래 */
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95);
  }
  #location-country {
    font-size: 36px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  #location-city {
    font-size: 19px;
    font-weight: 600;
    color: #ffd166;
  }

  /* 시작 시 자유 주행 카운트다운 */
  #countdown-overlay {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 620;
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  #countdown-number {
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    background: rgba(20,110,70,0.85);
    width: 74px;
    height: 74px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  #countdown-sub {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 4px 12px;
    border-radius: 999px;
  }

  /* ===== 위치 권한 오버레이 ===== */
  #permission-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0d1117;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  #permission-overlay h1 { font-size: 20px; margin-bottom: 10px; }
  #permission-overlay p { font-size: 14px; color: #a9b1bb; margin: 4px 0 26px; line-height: 1.5; }
  #start-btn {
    background: #2a7f62;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #start-domestic-random-btn {
    margin-top: 14px;
    background: #8a6d2c;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #start-domestic-random-btn:disabled,
  #start-capital-btn:disabled,
  #start-btn:disabled {
    opacity: 0.55;
  }
  #start-capital-btn {
    margin-top: 14px;
    background: #2c4d8a;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #permission-note {
    margin-top: 16px;
    font-size: 12px;
    color: #6b7280;
    min-height: 16px;
  }
</style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="지도 운전 게임">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault();
      window._pwaE=e;
      var b=document.createElement('div');
      b.style='position:fixed;bottom:0;left:0;right:0;background:#7c3aed;color:#fff;padding:18px;text-align:center;z-index:9999;font-size:15px;font-weight:bold;cursor:pointer;font-family:sans-serif;';
      b.innerHTML='📲 홈화면에 앱 추가하기 · Add to Home Screen';
      b.onclick=async function(){window._pwaE.prompt();var r=await window._pwaE.userChoice;if(r.outcome==='accepted')b.remove();};
      document.body.appendChild(b);
    });
  </script>
</head>
<body>

<div id="map"></div>

<!-- 화면 중앙 고정 자동차 (SVG, 위에서 내려다본 형태) -->
<div id="car">
  <svg viewBox="0 0 34 58">
    <path d="M17 1 C25 1 30 8 30 18 L30 46 C30 53 25 57 17 57 C9 57 4 53 4 46 L4 18 C4 8 9 1 17 1 Z"
          fill="#ff5a5f" stroke="#7a1216" stroke-width="1.5"/>
    <rect x="8" y="12" width="18" height="14" rx="3" fill="#1a2733" opacity="0.85"/>
    <rect x="8" y="34" width="18" height="12" rx="3" fill="#1a2733" opacity="0.6"/>
    <circle cx="17" cy="10" r="2.2" fill="#fff6c9"/>
  </svg>
</div>

<div id="wheel-zone">
  <div id="wheel-circle">
    <div id="wheel-center-dot"></div>
    <div id="wheel-needle"></div>
  </div>
</div>

<div id="controls">
  <button id="btn-forward" class="ctrl-btn">전진</button>
  <button id="btn-stop" class="ctrl-btn active-state">멈춤</button>
  <button id="btn-reverse" class="ctrl-btn">후진</button>
</div>

<div id="speed-controls">
  <button id="btn-speed-up" class="speed-btn">+</button>
  <button id="btn-speed-down" class="speed-btn">−</button>
</div>

<div id="hud-row">
  <div id="score-hud">점수: 0</div>
  <div id="hud">속도: 0 km/h</div>
</div>
<button id="pause-btn" aria-label="일시정지">⏸</button>
<div id="offroad-warning">도로 이탈!</div>
<div id="catch-warning">경찰에게 붙잡히는 중...</div>
<div id="detected-warning">🚨 발각됨!</div>
<div id="police-layer"></div>

<div id="location-banner">
  <div id="location-country"></div>
  <div id="location-city"></div>
</div>

<div id="countdown-overlay">
  <div id="countdown-number">10</div>
  <div id="countdown-sub">자유 주행 시간! 이후 경찰 출동</div>
</div>

<div id="caught-overlay">
  <h1>체포되었습니다!</h1>
  <p>경찰차의 포위망 안에 5초를 초과해서 머물러 붙잡혔습니다.</p>
  <div id="caught-buttons">
    <button id="restart-here-btn">현 위치에서 바로 시작</button>
    <button id="restart-start-btn">처음 위치로 돌아가기</button>
    <button id="restart-main-btn">메인화면으로 가기</button>
  </div>
</div>

<div id="permission-overlay">
  <h1>지도 운전 게임</h1>
  <p>실제 지도 위에서 운전을 시작하려면<br/>내 위치 권한이 필요합니다.</p>
  <button id="start-btn">위치 권한 허용하고 시작하기</button>
  <button id="start-domestic-random-btn">국내에서 랜덤 출발</button>
  <button id="start-capital-btn">해외 나라 수도에서 출발하기</button>
  <div id="permission-note"></div>
</div>

<script>
/* =========================================================
   지도 운전 게임 - 메인 스크립트
   - OpenFreeMap(무료, 키 불필요) 벡터 타일 + MapLibre GL JS 사용
   - 자동차는 항상 화면 정중앙에 고정, 실제로 움직이는 건 "지도"
   - 지도의 방위(bearing)는 항상 북쪽 고정, 자동차 아이콘 자체가 회전함
   ========================================================= */

// ---------- 1. 자동차 물리 상태 ----------
const car = {
  lat: 37.5665,      // 초기값(위치 권한 실패 시 서울시청으로 대체)
  lng: 126.9780,
  heading: 0,        // 0 = 북쪽, 시계방향 각도(도)
  speed: 0,          // m/s (양수: 전진, 음수: 후진)
  maxForwardSpeed: 80 / 3.6,   // 최고 전진 속도(m/s) - 기본 80km/h로 시작
  maxReverseSpeed: 4.5, // 최고 후진 속도(m/s)
  accel: 8,             // 가속도(m/s^2) - 경찰 추격전에서 너무 굼뜨지 않도록 기존(5)보다 상향
  brakeDecel: 9,        // 멈춤 버튼일 때 감속도
};

let throttleMode = 'forward'; // 'forward' | 'stop' | 'reverse' - 시작하자마자 자동으로 전진

// 화면에 그릴 때 쓰는 "연속된" 각도값. car.heading은 0~360으로 랩되지만,
// 화면 회전 애니메이션은 0/360 경계에서 튀지 않도록 이 값으로 따로 관리한다.
let visualHeading = 0;

// ---------- 2. 지도 초기화 ----------
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty', // 무료 오픈프리맵 스타일
  center: [car.lng, car.lat],
  zoom: 16,
  pitch: 0,           // 3D 기울임 없이 완전한 위에서 내려다보는 2D 시점
  bearing: 0,         // 항상 북쪽 고정
  interactive: false, // 사용자가 손가락으로 지도를 직접 움직이지 못하게 함(운전으로만 이동)
  attributionControl: { compact: true }
});

// 위성사진 위에 실제 도로선만 겹쳐 보이는 화면을 만든다:
// 1) Esri 위성 래스터 타일을 가장 아래에 깔고
// 2) 기존 벡터 스타일의 배경/땅/건물 같은 "면(fill)" 레이어들은 위성사진을 가려버리므로 전부 숨기고
// 3) 도로 강조선(drivable-road-highlight)만 위성사진 위에 그대로 남긴다 (지명/도로명 라벨도 유지)
map.on('load', () => {
  const style = map.getStyle();
  // 스타일 안에서 vector 타입 소스를 자동으로 찾는다 (OpenFreeMap 내부 소스 이름 대비)
  let vectorSourceId = null;
  for (const key in style.sources) {
    if (style.sources[key].type === 'vector') { vectorSourceId = key; break; }
  }

  // ---- 1) 무료 위성 타일(Esri World Imagery, API 키 불필요) 추가 ----
  map.addSource('esri-satellite', {
    type: 'raster',
    tiles: [
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
    ],
    tileSize: 256,
    attribution: 'Esri, Maxar, Earthstar Geographics'
  });
  const bottomLayerId = style.layers.length ? style.layers[0].id : undefined;
  map.addLayer({
    id: 'esri-satellite-layer',
    type: 'raster',
    source: 'esri-satellite',
    paint: { 'raster-opacity': 1 }
  }, bottomLayerId); // 스타일의 가장 아래(첫 레이어) 자리에 삽입 = 배경처럼 깔림

  // ---- 2) 위성사진을 가리는 배경/땅/건물 등 "면" 레이어는 숨김 (라벨은 남겨서 지명 파악 가능하게 함) ----
  style.layers.forEach((layer) => {
    if (layer.type === 'background' || layer.type === 'fill' || layer.type === 'fill-extrusion' || layer.type === 'line') {
      map.setLayoutProperty(layer.id, 'visibility', 'none');
    }
  });

  // ---- 3) 실제 도로 벡터 선을, 위성사진 위에서도 눈에 잘 띄는 색으로 강조해서 그린다 ----
  //    (단, "운전 가능한 도로"만 필터링해서 표시: 인도/자전거길/계단/철도/트램/페리 등은 제외)
  if (vectorSourceId) {
    map.addLayer({
      id: 'drivable-road-highlight',
      type: 'line',
      source: vectorSourceId,
      'source-layer': 'transportation', // OpenMapTiles 스키마의 도로 레이어명
      // OpenMapTiles의 'class' 속성 중, 자동차가 실제로 다닐 수 있는 도로 종류만 남긴다.
      // 제외되는 것들: path(오솔길), footway(인도), cycleway(자전거도로), steps(계단), pedestrian(보행자전용구역),
      //              bridleway(승마도로), track(비포장 농로), rail/tram/subway/light_rail/monorail/funicular(철도류),
      //              ferry(뱃길), aerialway(케이블카), raceway(경주트랙)
      filter: ['match', ['get', 'class'],
        ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'],
        true,
        false
      ],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': '#ffcc00',
        'line-opacity': 0.5,
        'line-width': [
          'interpolate', ['linear'], ['zoom'],
          14, 3,
          17, 12,
          20, 24
        ]
      }
    });
  }
});

// ---------- 3. 위치 권한 요청 및 시작 ----------
const overlay = document.getElementById('permission-overlay');
const noteEl = document.getElementById('permission-note');
const mapEl = document.getElementById('map');

// Nominatim(무료 API)은 초당 1회 요청을 권장하므로, 연속 호출 시 최소 간격을 보장하는 헬퍼.
let lastNominatimCallAt = 0;
async function nominatimFetch(url) {
  const waitMs = Math.max(0, 1100 - (Date.now() - lastNominatimCallAt));
  if (waitMs > 0) await new Promise((r) => setTimeout(r, waitMs));
  lastNominatimCallAt = Date.now();
  return fetch(url);
}

// 좌표 → 주소 정보(국가/도시 등)를 조회한다. zoom 값으로 상세도를 조절한다(3=국가 수준, 10=도시/군 수준).
async function reverseGeocodeDetail(lat, lng, zoom) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=${zoom}&addressdetails=1`;
  const res = await nominatimFetch(url);
  if (!res.ok) throw new Error('역지오코딩 요청 실패');
  const data = await res.json();
  if (!data || !data.address) throw new Error('주소 정보를 찾지 못함');
  return data;
}

// 주소 데이터에서 도시/군 수준의 표시용 이름을 최대한 뽑아낸다.
function extractCityLabel(address) {
  return address.city || address.town || address.village || address.county
      || address.state_district || address.state || '';
}

// 화면 중앙에 국가명(크게) + 도시명(작게)을 3초간 보여주고 사라지는 배너.
// "지도와 자동차가 함께 화면에 나타나는 시점"에 호출해서 쓴다.
let locationBannerHideTimer = null;
function showLocationBanner(country, city) {
  const banner = document.getElementById('location-banner');
  document.getElementById('location-country').textContent = country || '';
  document.getElementById('location-city').textContent = city || '';
  banner.style.display = 'flex';
  banner.style.opacity = '1';
  if (locationBannerHideTimer) clearTimeout(locationBannerHideTimer);
  locationBannerHideTimer = setTimeout(() => {
    banner.style.display = 'none';
  }, 3000); // 요청대로 3초간 노출 후 사라짐
}

// ---------- 3-0. "국내에서 랜덤 출발" 기능 ----------
// Nominatim(OpenStreetMap 무료 역지오코딩 API)으로 현재 위치가 속한 "나라"를 확인하고,
// 그 나라의 대략적인 경계 상자(bounding box) 안에서 무작위 좌표를 뽑는다.
// 뽑은 좌표 주변에 실제 도로가 있는지 지도에서 직접 확인해서, 없으면(바다/산악지대 등) 다시 뽑는다.
// 나아가, 경계 상자는 사각형이라 실제 국경과 완전히 일치하지 않을 수 있으므로(섬/해안 지역 등),
// 도로를 찾은 후보 지점을 다시 한번 역지오코딩해서 "정말로 같은 나라인지" 국가 코드로 검증한다.
async function reverseGeocodeCountry(lat, lng) {
  // zoom=3 → "국가" 수준의 결과를 요청 (그래야 boundingbox가 해당 나라 전체 범위로 넓게 나온다)
  const data = await reverseGeocodeDetail(lat, lng, 3);
  if (!data.boundingbox) throw new Error('나라 경계 정보를 찾지 못함');
  const bbox = data.boundingbox.map(Number); // [남쪽위도, 북쪽위도, 서쪽경도, 동쪽경도]
  const countryName = data.address.country || data.display_name || '알 수 없는 나라';
  const countryCode = data.address.country_code || '';
  return { countryName, countryCode, bbox };
}

// 경계 상자 안에서 균등 분포로 무작위 좌표 하나를 뽑는다.
function randomPointInBBox(bbox) {
  const [south, north, west, east] = bbox;
  return {
    lat: south + Math.random() * (north - south),
    lng: west + Math.random() * (east - west)
  };
}

// 지정한 좌표로 지도를 옮긴 뒤, 화면에 실제 "운전 가능한 도로"가 보이는지 확인한다.
// (map.once('idle')로 벡터 타일 로딩이 끝나길 기다린 다음 조회해야 정확하다)
function hasRoadsNear(lat, lng) {
  return new Promise((resolve) => {
    map.once('idle', () => {
      let feats;
      try {
        feats = map.queryRenderedFeatures(
          [[0, 0], [window.innerWidth, window.innerHeight]],
          { layers: ['drivable-road-highlight'] }
        );
      } catch (e) { feats = null; }
      resolve(!!(feats && feats.length > 0));
    });
    map.jumpTo({ center: [lng, lat], zoom: 14, bearing: 0, pitch: 0 });
  });
}

const domesticRandomBtn = document.getElementById('start-domestic-random-btn');
domesticRandomBtn.addEventListener('click', () => {
  noteEl.textContent = '내 위치를 확인하는 중...';
  if (!navigator.geolocation) {
    startWithFallback('이 브라우저는 위치 확인을 지원하지 않아 서울시청 근처에서 시작합니다.');
    return;
  }
  // 확인 중에 다른 버튼을 눌러 상태가 꼬이지 않도록 잠시 버튼들을 비활성화
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-capital-btn').disabled = true;
  domesticRandomBtn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;
      let chosen = null;
      let chosenCity = '';
      let countryLabel = '';
      let countryCode = '';
      try {
        noteEl.textContent = '내가 있는 나라를 확인하는 중...';
        const info = await reverseGeocodeCountry(userLat, userLng);
        countryLabel = info.countryName;
        countryCode = info.countryCode;
        noteEl.textContent = `${countryLabel} 안에서 도로가 있는 곳을 찾는 중...`;

        const MAX_ATTEMPTS = 20; // 최대 20번까지 무작위 지점을 시도 (산/바다만 계속 걸리는 경우 대비)
        for (let i = 0; i < MAX_ATTEMPTS && !chosen; i++) {
          const candidate = randomPointInBBox(info.bbox);
          const ok = await hasRoadsNear(candidate.lat, candidate.lng);
          if (!ok) continue;

          // 경계 상자(bbox)는 사각형이라 실제 국경과 다를 수 있으므로(섬/해안 지역이 다른 나라 영역과 겹칠 수 있음),
          // 도로가 있는 후보라도 실제로 "같은 나라"가 맞는지 한 번 더 역지오코딩으로 검증한다.
          try {
            const detail = await reverseGeocodeDetail(candidate.lat, candidate.lng, 10);
            if (detail.address.country_code === countryCode) {
              chosen = candidate;
              chosenCity = extractCityLabel(detail.address);
            }
          } catch (e) { /* 검증 요청 실패 시 이 후보는 포기하고 다음 후보로 */ }
        }
      } catch (e) {
        // 역지오코딩(나라 확인) 자체가 실패한 경우: 그냥 현재 GPS 위치 근처에서 시작
      }

      if (chosen) {
        car.lat = chosen.lat;
        car.lng = chosen.lng;
        noteEl.textContent = `${countryLabel} 국내의 무작위 위치에서 출발합니다...`;
      } else {
        car.lat = userLat;
        car.lng = userLng;
        noteEl.textContent = countryLabel
          ? `${countryLabel} 안에서 도로가 있는 곳을 찾지 못해 현재 위치 근처에서 시작합니다.`
          : '나라를 확인하지 못해 현재 위치 근처에서 시작합니다.';
        // 현재 위치 근처로 시작하는 경우에도, 배너에 표시할 도시명을 한 번 더 시도해서 가져온다(실패해도 무방).
        try {
          const detail = await reverseGeocodeDetail(userLat, userLng, 10);
          chosenCity = extractCityLabel(detail.address);
          if (!countryLabel) countryLabel = detail.address.country || '';
        } catch (e) { /* 실패해도 국가명만으로 배너 표시 */ }
      }

      document.getElementById('start-btn').disabled = false;
      document.getElementById('start-capital-btn').disabled = false;
      domesticRandomBtn.disabled = false;
      setTimeout(() => beginGame({ country: countryLabel, city: chosenCity }), 700);
    },
    () => {
      document.getElementById('start-btn').disabled = false;
      document.getElementById('start-capital-btn').disabled = false;
      domesticRandomBtn.disabled = false;
      startWithFallback('위치 권한이 거부되어 서울시청 근처에서 시작합니다.');
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

  car.lng = pick.lng;
  noteEl.textContent = `${pick.country} ${pick.city}에서 출발합니다...`;
  setTimeout(() => beginGame({ country: pick.country, city: pick.city }), 600); // 안내 문구를 잠깐 보여준 뒤 시작 (beginGame 안에서 도로 위로 자동 스냅됨)
});

document.getElementById('start-btn').addEventListener('click', () => {
  noteEl.textContent = '내 위치를 확인하는 중...';
  if (!navigator.geolocation) {
    startWithFallback('이 브라우저는 위치 확인을 지원하지 않아 서울시청 근처에서 시작합니다.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      car.lat = pos.coords.latitude;
      car.lng = pos.coords.longitude;
      beginGame();
    },
    (err) => {
      startWithFallback('위치 권한이 거부되어 서울시청 근처에서 시작합니다.');
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

function startWithFallback(message) {
  noteEl.textContent = message;
  setTimeout(beginGame, 900); // 안내 문구를 잠깐 보여준 뒤 시작
}

function beginGame(locationInfo) {
  overlay.style.display = 'none';
  // 낮은 줌에서 자세히 확대된 줌으로 서서히 이동하며 "지도가 점차 나타나는" 연출
  map.jumpTo({ center: [car.lng, car.lat], zoom: 14, bearing: 0, pitch: 0 });
  mapEl.classList.add('revealed');
  // 지도(위성사진)가 서서히 나타나기 시작하고, 화면 중앙의 자동차도 이 순간 함께 보이기 시작하므로,
  // "국내에서 랜덤 출발"/"해외 나라 수도에서 출발" 버튼으로 시작한 경우에는 바로 이 타이밍에 배너를 띄운다.
  if (locationInfo) showLocationBanner(locationInfo.country, locationInfo.city);
  map.flyTo({
    center: [car.lng, car.lat],
    zoom: 16,          // 요청에 따라 조정
    bearing: 0,
    pitch: 0,         // 3D 없이 완전한 탑다운 2D
    speed: 0.6,
    essential: true
  });
  // 중요: flyTo 확대 애니메이션이 "끝난 뒤"에 게임 루프를 시작해야 함.
  // 게임 루프가 매 프레임 jumpTo(중심좌표만)를 호출하는데, 이걸 애니메이션 도중에 실행하면
  // flyTo가 중간에 끊겨서 줌이 낮은 상태로 멈춰버리는 문제가 있었음(그래서 지도가 넓게 보였음).
  map.once('moveend', () => {
    // 실제 위치(또는 해외 수도처럼 방금 순간이동한 새 지역)가 도로 밖(건물 안 등)이어도 도로 위에서 시작하도록 보정.
    // 새 지역으로 막 이동한 직후에는 도로 벡터 타일이 아직 다 로딩되지 않아 스냅이 한 번에 실패할 수 있으므로,
    // "게임을 시작하는 이 순간"에 한해서만 짧은 간격으로 여러 번 재시도한다(재시작/체포 후 등 다른 시점에는 영향 없음).
    trySnapWithRetry(0);

    function trySnapWithRetry(attempt) {
      const snapped = snapCarToNearestRoad();
      const maxAttempts = 10; // 최대 10번, 200ms 간격 → 최대 약 2초까지 도로 타일 로딩을 기다림
      if (!snapped && attempt < maxAttempts) {
        setTimeout(() => trySnapWithRetry(attempt + 1), 200);
        return;
      }
      initialLat = car.lat;    // "처음 위치로 돌아가기" 버튼을 위해, 최초 시작 위치/방향을 기억해둔다
      initialLng = car.lng;
      initialHeading = car.heading;
      startPoliceCountdown(); // 자유 주행 카운트다운 시작 → 끝나면 경찰차 스폰
      requestAnimationFrame(gameLoop);
    }
  });
}

// 자동차의 시작 위치가 도로 위가 아니라면(집/건물 안에서 실행하는 경우 등),
// 현재 화면에 보이는 도로 중 가장 가까운 지점으로 위치를 옮기고, 그 도로 방향으로 머리를 맞춘다.
// 반환값: 스냅에 성공했으면 true, (아직 도로 타일이 안 그려졌거나 화면에 도로가 없어서) 실패했으면 false.
function snapCarToNearestRoad() {
  if (typeof turf === 'undefined') return false; // 라이브러리 로드 실패 시 원래 위치 그대로 시작

  let feats;
  try {
    // 화면 전체 범위에서 도로 강조 레이어를 조회 (시작 지점 근처에 국한하지 않고 넓게 탐색)
    feats = map.queryRenderedFeatures(
      [[0, 0], [window.innerWidth, window.innerHeight]],
      { layers: ['drivable-road-highlight'] }
    );
  } catch (e) { return false; }
  if (!feats || feats.length === 0) return false; // 화면 안에 도로 자체가 안 보이면(아직 타일 로딩 중일 수 있음) 스냅 실패

  const carPoint = turf.point([car.lng, car.lat]);
  let best = null;
  let bestDist = Infinity;
  for (const f of feats) {
    try {
      const snapped = turf.nearestPointOnLine(f, carPoint, { units: 'meters' });
      if (snapped.properties.dist < bestDist) {
        bestDist = snapped.properties.dist;
        best = { snapped, feature: f };
      }
    } catch (e) { /* 도형 형식이 안 맞으면 건너뜀 */ }
  }
  if (!best) return false;

  // 자동차 위치를 도로 위 가장 가까운 지점으로 이동
  const [snapLng, snapLat] = best.snapped.geometry.coordinates;
  car.lat = snapLat;
  car.lng = snapLng;

  // 스냅된 지점 주변 도로의 방향으로 자동차 머리를 맞춰줌 (LineString인 경우에만 계산)
  try {
    const coords = best.feature.geometry.coordinates;
    if (best.feature.geometry.type === 'LineString') {
      const idx = best.snapped.properties.index;
      const a = coords[idx];
      const b = coords[Math.min(idx + 1, coords.length - 1)];
      if (a && b) {
        const bearing = turf.bearing(turf.point(a), turf.point(b));
        car.heading = (bearing + 360) % 360;
        visualHeading = car.heading;
      }
    }
  } catch (e) { /* 방향 계산에 실패해도 위치 스냅은 그대로 유지 */ }

  map.jumpTo({ center: [car.lng, car.lat] });
  return true;
}

// 경찰차 대수만큼, 플레이어 주변의 무작위 방향/거리에 스폰시키고
// (가능하면) 가장 가까운 도로 위로 스냅한 뒤, 화면에 표시할 DOM 요소도 함께 만든다.
function spawnPoliceCars() {
  const layer = document.getElementById('police-layer');
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  for (let i = 0; i < POLICE_COUNT; i++) {
    // 플레이어를 중심으로 여러 방향/거리를 여러 번 시도해서, "실제로 도로 위인" 지점을 찾을 때까지 반복
    let lat = null, lng = null, bearingDeg = 0;
    const baseBearing = (360 / POLICE_COUNT) * i;
    for (let attempt = 0; attempt < 25; attempt++) {
      const tryBearing = baseBearing + (Math.random() * 60 - 30);
      const tryDist = POLICE_SPAWN_MIN_DIST_M + Math.random() * (POLICE_SPAWN_MAX_DIST_M - POLICE_SPAWN_MIN_DIST_M);
      const bearingRad = tryBearing * Math.PI / 180;
      const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
      const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

      const roadInfo = findRoadPointNear(tryLat, tryLng, 35); // 후보 지점에서 35m 이내에 실제 도로가 있어야 인정
      if (roadInfo) {
        lat = roadInfo.lat;
        lng = roadInfo.lng;
        bearingDeg = tryBearing;
        break;
      }
    }
    // 25번 시도해도 도로를 못 찾았다면(강/공터가 아주 넓은 경우), 최후의 수단으로
    // 플레이어가 서 있는 도로(항상 도로 위로 보정되어 있음) 바로 근처에 배치한다.
    if (lat === null) {
      const fallback = findRoadPointNear(car.lat, car.lng, 200) || { lat: car.lat, lng: car.lng };
      lat = fallback.lat;
      lng = fallback.lng;
      bearingDeg = baseBearing;
    }

    const el = document.createElement('div');
    el.className = 'police-car';
    el.innerHTML = `
      <svg viewBox="0 0 34 58">
        <path d="M17 1 C25 1 30 8 30 18 L30 46 C30 53 25 57 17 57 C9 57 4 53 4 46 L4 18 C4 8 9 1 17 1 Z"
              fill="#274b8f" stroke="#0f2452" stroke-width="1.5"/>
        <rect x="8" y="12" width="18" height="14" rx="3" fill="#1a2733" opacity="0.85"/>
        <rect x="8" y="34" width="18" height="12" rx="3" fill="#1a2733" opacity="0.6"/>
        <rect class="police-light" x="10" y="24" width="14" height="5" rx="1.5" fill="#ff3b3b"/>
      </svg>`;
    layer.appendChild(el);

    const circleEl = document.createElement('div');
    circleEl.className = 'catch-circle mode-patrol'; // 처음엔 항상 "순찰" 상태 → 초록 테두리 탐지 범위로 시작
    layer.appendChild(circleEl);

    policeCars.push({
      lat, lng, heading: bearingDeg, speed: 0, el, circleEl, farTimer: 0,
      lastGoodLat: lat, lastGoodLng: lng, // 마지막으로 확인된 "도로 위" 좌표 (건물/강 등으로 새는 것을 막는 기준점)
      state: 'patrol',                    // 'patrol'(순찰, 플레이어 위치 모름) | 'chase'(추격, 발각됨)
      wanderHeading: bearingDeg,           // 순찰 중 목표로 삼는 방향
      wanderTimer: POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC),
      route: null,          // 추격 중 도로를 따라가는 경로(웨이포인트 배열) - 없으면 직선 추격으로 대체
      routeIndex: 0,        // 지금 향하고 있는 경로상의 웨이포인트 인덱스
      routeRecalcTimer: 0,  // 경로를 다시 계산하기까지 남은 시간(초)
    });
  }
}

// 게임 시작 직후 지정된 시간(초) 동안 화면에 큰 숫자로 카운트다운을 보여주고,
// 그 시간 동안은 경찰차를 스폰하지 않아 플레이어가 자유롭게 돌아다닐 수 있게 한다.
// 카운트다운이 끝나면 그제서야 spawnPoliceCars()를 호출해 경찰차들을 등장시킨다.
function startPoliceCountdown() {
  const overlay = document.getElementById('countdown-overlay');
  const numberEl = document.getElementById('countdown-number');
  let remaining = POLICE_SPAWN_DELAY_SECONDS;

  overlay.style.display = 'flex';
  numberEl.textContent = remaining;

  const intervalId = setInterval(() => {
    if (isPaused) return; // 일시정지 중에는 카운트다운도 함께 멈춘다
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(intervalId);
      overlay.style.display = 'none';
      spawnPoliceCars(); // 카운트다운 종료 → 경찰차가 어디선가 나타남
    } else {
      numberEl.textContent = remaining;
    }
  }, 1000);
}

// ---------- 4. 왼쪽 버튼: 전진 / 멈춤 / 후진 ----------
const btnForward = document.getElementById('btn-forward');
const btnStop = document.getElementById('btn-stop');
const btnReverse = document.getElementById('btn-reverse');

function setThrottle(mode) {
  throttleMode = mode;
  [btnForward, btnStop, btnReverse].forEach(b => b.classList.remove('active-state'));
  if (mode === 'forward') btnForward.classList.add('active-state');
  if (mode === 'stop') btnStop.classList.add('active-state');
  if (mode === 'reverse') btnReverse.classList.add('active-state');
}
btnForward.addEventListener('pointerdown', () => setThrottle('forward'));
btnStop.addEventListener('pointerdown', () => setThrottle('stop'));
btnReverse.addEventListener('pointerdown', () => setThrottle('reverse'));
setThrottle('forward'); // 시작하자마자 전진 상태이므로, 버튼 표시도 처음부터 "전진"이 활성화되어 보이도록 동기화

// ---------- 4-0. 속도 표시 아래의 일시정지 버튼 ----------
// 누를 때마다 일시정지 ↔ 재개를 토글한다. 일시정지 중에는 gameLoop와 자유주행 카운트다운이 모두 멈춘다.
const pauseBtn = document.getElementById('pause-btn');
pauseBtn.addEventListener('click', () => {
  isPaused = !isPaused;
  pauseBtn.textContent = isPaused ? '▶' : '⏸';
  pauseBtn.setAttribute('aria-label', isPaused ? '재생' : '일시정지');
  pauseBtn.classList.toggle('is-paused', isPaused);
  if (!isPaused) {
    // 재개 시, 멈춰있던 동안 흐른 실제 시간을 dt에 한꺼번에 반영해 차가 순간이동하듯 튀지 않도록 기준 시각을 갱신
    lastTime = performance.now();
  }
});

// ---------- 4-1. 전진 버튼 옆 +/- 버튼: 최고 전진 속도를 10km/h씩 조절 ----------
const btnSpeedUp = document.getElementById('btn-speed-up');
const btnSpeedDown = document.getElementById('btn-speed-down');
const SPEED_STEP_MS = 10 / 3.6;      // 10km/h를 m/s로 환산
const MIN_MAX_SPEED_MS = 10 / 3.6;   // 최고속도 하한: 10km/h
const MAX_MAX_SPEED_MS = 190 / 3.6;  // 최고속도 상한: 190km/h

function adjustMaxSpeed(deltaMs) {
  car.maxForwardSpeed = Math.max(
    MIN_MAX_SPEED_MS,
    Math.min(MAX_MAX_SPEED_MS, car.maxForwardSpeed + deltaMs)
  );
  // 현재 속도가 새 최고속도보다 높다면 즉시 새 상한으로 맞춰줌
  if (car.speed > car.maxForwardSpeed) car.speed = car.maxForwardSpeed;
}
btnSpeedUp.addEventListener('pointerdown', () => adjustMaxSpeed(SPEED_STEP_MS));
btnSpeedDown.addEventListener('pointerdown', () => adjustMaxSpeed(-SPEED_STEP_MS));

// 버튼을 누르고 있는 동안 자동으로 반복 실행되도록 하는 공용 롱프레스 헬퍼
// (처음 한 번 즉시 실행 → REPEAT_DELAY_MS 뒤부터 → REPEAT_INTERVAL_MS 간격으로 계속 반복)
function attachHoldRepeat(el, action) {
  const REPEAT_DELAY_MS = 350;    // 누른 뒤 반복이 시작되기까지의 지연시간
  const REPEAT_INTERVAL_MS = 100; // 반복 간격
  let delayTimer = null;
  let repeatTimer = null;

  function stop() {
    clearTimeout(delayTimer);
    clearInterval(repeatTimer);
    delayTimer = null;
    repeatTimer = null;
  }

  el.addEventListener('pointerdown', () => {
    stop();
    action(); // 탭 한 번만 해도 즉시 1회 반영
    delayTimer = setTimeout(() => {
      repeatTimer = setInterval(action, REPEAT_INTERVAL_MS);
    }, REPEAT_DELAY_MS);
  });

  ['pointerup', 'pointerleave', 'pointercancel'].forEach((evt) => {
    el.addEventListener(evt, stop);
  });
}
attachHoldRepeat(btnSpeedUp, () => adjustMaxSpeed(SPEED_STEP_MS));
attachHoldRepeat(btnSpeedDown, () => adjustMaxSpeed(-SPEED_STEP_MS));

// ---------- 5. 우측 하단 원형 핸들: 중심 기준 각도를 그대로 자동차 방향에 매핑 ----------
const wheelZone = document.getElementById('wheel-zone');
const wheelNeedle = document.getElementById('wheel-needle');
let wheelActive = false;
const WHEEL_DEADZONE_PX = 10; // 중심에서 너무 가까우면 각도가 불안정하므로 무시

function updateHeadingFromPointer(e) {
  const rect = wheelZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist < WHEEL_DEADZONE_PX) return;
  // 중심점 기준 각도: 0=위쪽(북쪽/정면), 시계방향으로 증가 (자동차 heading 정의와 동일)
  const angle = Math.atan2(dx, -dy) * 180 / Math.PI;
  car.heading = (angle + 360) % 360;
}

wheelZone.addEventListener('pointerdown', (e) => {
  wheelActive = true;
  wheelZone.setPointerCapture(e.pointerId);
  updateHeadingFromPointer(e);
});
wheelZone.addEventListener('pointermove', (e) => {
  if (!wheelActive) return;
  updateHeadingFromPointer(e);
});
function releaseWheel() { wheelActive = false; }
wheelZone.addEventListener('pointerup', releaseWheel);
wheelZone.addEventListener('pointercancel', releaseWheel);

// ---------- 6. 메인 게임 루프 ----------
const hud = document.getElementById('hud');
const scoreHud = document.getElementById('score-hud');

// ---------- 점수 시스템: 주인공 차가 "실제로 이동한 거리"만큼만 점수가 오른다 ----------
// - 정차해 있으면(경찰 순찰을 피해 멈춰 있든, 그냥 멈춰 있든) 이동 거리가 0이므로 점수도 자연히 멈춘다.
// - 거리를 그대로 점수로 주면 숫자가 너무 커지고 장거리 질주만으로 쉽게 고득점이 되므로,
//   일정 거리(m)당 1점만 오르도록 변환 비율을 적당히 낮춰서 사용한다.
let score = 0;                          // 내부적으로는 소수점까지 누적 (표시할 때만 정수로 반올림)
const SCORE_METERS_PER_POINT = 15;      // 15m 이동할 때마다 1점 (숫자를 원하면 이 값만 조절하면 됨)
const offroadWarning = document.getElementById('offroad-warning');
// ---- 경찰차(경찰과 도둑) 관련 튜닝 값 ----
const POLICE_COUNT = 3;                 // 경찰차 대수
const POLICE_STEER_RATE_DEG_PER_SEC = 200; // 경찰차가 방향을 트는 속도(도/초)
const POLICE_SPAWN_MIN_DIST_M = 380;    // 최초 스폰 시 플레이어로부터 최소 거리(m) - 반드시 탐지 범위(300m)보다 커야 스폰 즉시 발각되지 않음
const POLICE_SPAWN_MAX_DIST_M = 600;    // 최초 스폰 시 플레이어로부터 최대 거리(m)
const CATCH_RADIUS_METERS = 25;         // 체포 판정 원의 반지름(m) - 눈에 보이는 원과 어긋나지 않도록 타이트하게
const CATCH_HOLD_SECONDS = 5;           // 이 원 안에 이 시간(초)을 초과해서 머물면 체포

// 도로를 벗어난 순간, 현재 속도에서 이만큼(km/h)을 깎는다 → m/s로 환산해서 사용
const OFFROAD_PENALTY_DROP_MS = 10 / 3.6;
// 위 감속량을 몇 초에 걸쳐 "빠르게" 떨어뜨릴지 (속도 눈금계가 훅 줄어드는 연출용 시간)
const OFFROAD_PENALTY_DROP_DURATION = 0.25;
// (감속 후 대기 없이, 감속이 끝나자마자 곧바로 다시 가속이 가능해진다)

// 주어진 위경도 근처에서 가장 가까운 도로(강조 레이어) 위의 지점과 그 거리를 계산한다.
// - 주변에 도로 데이터 자체가 없으면(로딩 전 등) null 반환 → 호출 쪽에서 통과시켜 게임이 멈추지 않게 함
// - turf.js 미로딩 시에도 null 반환(안전장치)
function getNearestRoadInfo(lat, lng, boxHalfPx = 90) {
  if (typeof turf === 'undefined') return null;
  let screenPt;
  try {
    screenPt = map.project([lng, lat]);
  } catch (e) {
    return null;
  }
  const searchBox = [
    [screenPt.x - boxHalfPx, screenPt.y - boxHalfPx],
    [screenPt.x + boxHalfPx, screenPt.y + boxHalfPx]
  ];
  let feats;
  try {
    feats = map.queryRenderedFeatures(searchBox, { layers: ['drivable-road-highlight'] });
  } catch (e) {
    return null;
  }
  if (!feats || feats.length === 0) return null; // 주변에 도로 정보 자체가 없으면 판단 보류

  const turfPoint = turf.point([lng, lat]);
  let best = null;
  let bestDist = Infinity;
  for (const f of feats) {
    try {
      const snapped = turf.nearestPointOnLine(f, turfPoint, { units: 'meters' });
      if (snapped.properties.dist < bestDist) {
        bestDist = snapped.properties.dist;
        best = snapped.geometry.coordinates; // [lng, lat]
      }
    } catch (e) { /* 도형 형식이 안 맞으면 건너뜀 */ }
  }
  if (!best) return null;
  return { dist: bestDist, lng: best[0], lat: best[1] };
}

// getNearestRoadInfo를 여러 검색 반경(픽셀)으로 순차 재시도하면서,
// 실제로 "maxAcceptDistM" 이내에 있는 진짜 도로 지점을 찾는다.
// (화면 좁은 박스 안에 도로 렌더링 자체가 없어서 null이 나오는 경우를 보완)
function findRoadPointNear(lat, lng, maxAcceptDistM = 40) {
  for (const boxHalfPx of [90, 180, 320]) {
    const info = getNearestRoadInfo(lat, lng, boxHalfPx);
    if (info && info.dist <= maxAcceptDistM) return info;
  }
  return null;
}

// ============================================================
//  경찰차 길찾기: 화면에 렌더링된 도로선을 그래프로 만들고 최단경로를 구한다
// ============================================================

// 현재 화면(뷰포트)에 그려진 모든 도로 벡터선을 모아 "노드(교차점/꼭짓점) + 간선(도로 구간)" 그래프로 만든다.
// - 서로 다른 벡터 타일 경계에서 좌표가 미세하게 어긋나는 경우를 대비해, 작은 격자(SNAP)로 좌표를 반올림해
//   충분히 가까운 점들을 같은 노드로 합친다.
// - 도로 데이터가 아예 없으면(로딩 전 등) null을 반환한다.
function buildRoadGraph() {
  let feats;
  try {
    feats = map.queryRenderedFeatures({ layers: ['drivable-road-highlight'] });
  } catch (e) {
    return null;
  }
  if (!feats || feats.length === 0) return null;

  const nodeCoord = new Map(); // key -> [lng, lat] (해당 격자의 대표 좌표)
  const adj = new Map();       // key -> [{ to: key, dist: meters }, ...]

  function keyOf(lng, lat) {
    return Math.round(lat / ROAD_GRAPH_NODE_SNAP_DEG) + '_' + Math.round(lng / ROAD_GRAPH_NODE_SNAP_DEG);
  }
  function ensureNode(lng, lat) {
    const k = keyOf(lng, lat);
    if (!nodeCoord.has(k)) {
      nodeCoord.set(k, [lng, lat]);
      adj.set(k, []);
    }
    return k;
  }
  function addEdge(k1, k2, dist) {
    if (k1 === k2 || dist <= 0) return;
    adj.get(k1).push({ to: k2, dist });
    adj.get(k2).push({ to: k1, dist });
  }

  for (const f of feats) {
    const geom = f.geometry;
    if (!geom) continue;
    const lines = geom.type === 'LineString' ? [geom.coordinates]
                : geom.type === 'MultiLineString' ? geom.coordinates
                : null;
    if (!lines) continue;

    for (const coords of lines) {
      let prevKey = null, prevCoord = null;
      for (const c of coords) {
        const k = ensureNode(c[0], c[1]);
        if (prevKey !== null) {
          const dist = turf.distance(turf.point(prevCoord), turf.point(c), { units: 'meters' });
          addEdge(prevKey, k, dist);
        }
        prevKey = k;
        prevCoord = c;
      }
    }
    if (nodeCoord.size > ROAD_GRAPH_MAX_NODES) return null; // 너무 커지면 성능 보호를 위해 포기(호출 쪽에서 직선 추격으로 대체)
  }

  if (nodeCoord.size === 0) return null;
  return { nodeCoord, adj };
}

// 그래프에서 주어진 위경도와 가장 가까운 노드를 찾는다(경로의 시작/끝 지점을 그래프에 "붙이기" 위함).
function nearestGraphNode(graph, lng, lat) {
  let bestKey = null, bestDist = Infinity;
  const target = turf.point([lng, lat]);
  for (const [k, coord] of graph.nodeCoord) {
    const d = turf.distance(turf.point(coord), target, { units: 'meters' });
    if (d < bestDist) { bestDist = d; bestKey = k; }
  }
  return bestKey === null ? null : { key: bestKey, dist: bestDist };
}

// 다익스트라 최단경로: startLng/Lat에서 endLng/Lat까지, 그래프(도로망)를 따라가는 웨이포인트 배열을 반환한다.
// - 노드 수가 많지 않다는 전제(게임 화면 하나 분량의 도로만 대상) 하에, 우선순위 큐 없이 단순 선형 탐색으로 구현.
// - 경로를 못 찾으면(그래프가 끊어져 있는 등) null을 반환 → 호출 쪽에서 기존 직선 추격으로 대체(안전장치).
function findRoutePath(graph, startLng, startLat, endLng, endLat) {
  const startNode = nearestGraphNode(graph, startLng, startLat);
  const endNode = nearestGraphNode(graph, endLng, endLat);
  if (!startNode || !endNode) return null;

  const dist = new Map([[startNode.key, 0]]);
  const prev = new Map();
  const visited = new Set();

  while (true) {
    let u = null, uDist = Infinity;
    for (const [k, d] of dist) {
      if (!visited.has(k) && d < uDist) { uDist = d; u = k; }
    }
    if (u === null || u === endNode.key) break;
    visited.add(u);

    for (const edge of (graph.adj.get(u) || [])) {
      if (visited.has(edge.to)) continue;
      const nd = uDist + edge.dist;
      if (nd < (dist.has(edge.to) ? dist.get(edge.to) : Infinity)) {
        dist.set(edge.to, nd);
        prev.set(edge.to, u);
      }
    }
  }

  if (!dist.has(endNode.key)) return null; // 도로망 상으로 도달할 수 없음(그래프가 끊어짐 등)

  const pathKeys = [endNode.key];
  let cur = endNode.key;
  while (cur !== startNode.key) {
    cur = prev.get(cur);
    if (cur === undefined) return null; // 역추적 실패(이론상 발생하지 않아야 하지만 안전장치)
    pathKeys.push(cur);
  }
  pathKeys.reverse();

  const waypoints = pathKeys.map((k) => graph.nodeCoord.get(k));
  // 마지막 노드에서 멈추지 말고, 실제 플레이어 좌표까지 한 걸음 더 접근하도록 목표점을 추가
  waypoints.push([endLng, endLat]);
  return waypoints;
}

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000); // 초 단위, 급격한 프레임 드랍 방지
  lastTime = now;

  // 이미 체포된 상태이거나 일시정지 중이라면 모든 갱신을 멈추고 화면만 유지한다
  if (isCaught || isPaused) {
    requestAnimationFrame(gameLoop);
    return;
  }

  // 점수 계산용: 이번 프레임이 시작될 때의 위치를 기억해 둔다(프레임 끝의 실제 위치와 비교해 이동 거리를 구함)
  const scoreStartLat = car.lat;
  const scoreStartLng = car.lng;

  // --- 속도 갱신 ---
  if (offroadPenaltyState === 'dropping') {
    // 이탈 직후: 목표 속도(-10km/h)까지 짧은 시간 동안 빠르게 감속 (눈금계가 훅 줄어드는 연출)
    offroadPenaltyTimer += dt;
    const t = Math.min(1, offroadPenaltyTimer / OFFROAD_PENALTY_DROP_DURATION);
    car.speed = offroadPenaltyStartSpeed + (offroadPenaltyTargetSpeed - offroadPenaltyStartSpeed) * t;
    if (t >= 1) {
      car.speed = offroadPenaltyTargetSpeed;
      offroadPenaltyState = 'none'; // 대기 없이 곧바로 평소 가속 로직으로 복귀
      offroadPenaltyTimer = 0;
    }
  } else {
    // 패널티가 없는 평소 상태: 기존과 동일한 스로틀 기반 가속/감속
    const target = throttleMode === 'forward' ? car.maxForwardSpeed
                 : throttleMode === 'reverse' ? -car.maxReverseSpeed
                 : 0;
    const decel = throttleMode === 'stop' ? car.brakeDecel : car.accel;

    if (car.speed < target) {
      car.speed = Math.min(target, car.speed + car.accel * dt);
    } else if (car.speed > target) {
      car.speed = Math.max(target, car.speed - decel * dt);
    }
  }


  // --- 방향(heading)은 이제 오른쪽 조향 영역의 pointermove 이벤트에서 직접 갱신됨 ---
  // (손가락 이동량 = 자동차 머리 회전각, 1:1 직접 매핑 방식이라 여기서 별도 계산 불필요)

  // --- 위치(위경도) 후보값 계산 (아직 확정하지 않음) ---
  const headingRad = car.heading * Math.PI / 180;
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  const dNorth = car.speed * dt * Math.cos(headingRad);
  const dEast  = car.speed * dt * Math.sin(headingRad);
  const candidateLat = car.lat + dNorth / metersPerDegLat;
  const candidateLng = car.lng + dEast / metersPerDegLng;

  // --- 도로 위인지 확인하고, 이동을 확정한다 ---
  // 도로 위: 그대로 이동. 살짝 이탈: 이탈 "순간"에 -10km/h 급감속 패널티를 한 번 트리거하고
  // 도로 쪽으로 방향을 틀며 계속 진행(자동 복귀). 많이 이탈(OFFROAD_HARD_BLOCK_METERS 초과):
  // 방향만 도로 쪽으로 틀 뿐, 그 방향으로는 "전진 자체"가 막혀서 강이나 건물 단지를 뚫고 갈 수 없다.
  if (Math.abs(car.speed) > 0.001) {
    const roadInfo = findRoadPointNear(candidateLat, candidateLng, OFFROAD_DETECT_RANGE_METERS);
    const onRoad = !roadInfo || roadInfo.dist <= ROAD_HALF_WIDTH_METERS;
    const hardBlocked = roadInfo && roadInfo.dist > OFFROAD_HARD_BLOCK_METERS;

    if (onRoad) {
      car.lat = candidateLat;
      car.lng = candidateLng;
      offroadWarning.style.display = 'none';
      wasOffRoad = false; // 다시 도로 위로 복귀 → 다음 이탈 때 패널티가 새로 트리거되도록 초기화
    } else {
      offroadWarning.style.display = 'block';
      offroadWarning.textContent = hardBlocked ? '도로 이탈! (진행 불가)' : '도로 이탈!';
      offroadWarningHideAt = now + 900;

      // 방금 막 이탈한 "순간"이라면(직전 프레임까진 도로 위였다면) 급감속 패널티를 새로 트리거
      if (!wasOffRoad && offroadPenaltyState === 'none') {
        offroadPenaltyState = 'dropping';
        offroadPenaltyTimer = 0;
        offroadPenaltyStartSpeed = car.speed;
        if (car.speed > 0) {
          offroadPenaltyTargetSpeed = Math.max(0, car.speed - OFFROAD_PENALTY_DROP_MS);
        } else if (car.speed < 0) {
          offroadPenaltyTargetSpeed = Math.min(0, car.speed + OFFROAD_PENALTY_DROP_MS);
        } else {
          offroadPenaltyTargetSpeed = 0;
        }
      }
      wasOffRoad = true;

      // 1) 가장 가까운 도로 지점을 향한 방향(베어링) 계산
      const toRoadBearing = turf.bearing(
        turf.point([candidateLng, candidateLat]),
        turf.point([roadInfo.lng, roadInfo.lat])
      );

      // 2) 현재 heading을 그 방향으로 "제한된 속도"로 부드럽게 회전 (한 프레임에 확 꺾이지 않게)
      let hdiff = toRoadBearing - car.heading;
      hdiff = ((hdiff + 540) % 360) - 180; // -180~180 사이 최단 회전량으로 정규화
      const maxTurn = OFFROAD_STEER_RATE_DEG_PER_SEC * dt;
      car.heading = (car.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

      if (hardBlocked) {
        // 하드 블록: 방향만 바뀔 뿐, 도로에서 이만큼 멀어지는 이동은 아예 적용하지 않는다.
        // (다음 프레임에 heading이 도로 쪽으로 더 돌아가면, 그때는 dist가 줄어들어 다시 전진이 허용됨)
      } else {
        // 3) 위 속도 갱신 단계(dropping/holding/정상)에서 이미 결정된 car.speed를 그대로 사용해
        //    보정된 heading/speed로 이번 프레임 위치를 다시 계산, 실제로 도로 쪽으로 밀어 넣는다
        const hRad2 = car.heading * Math.PI / 180;
        const dN2 = car.speed * dt * Math.cos(hRad2);
        const dE2 = car.speed * dt * Math.sin(hRad2);
        car.lat += dN2 / metersPerDegLat;
        car.lng += dE2 / metersPerDegLng;
      }
    }
  }
  if (offroadWarningHideAt && now > offroadWarningHideAt) {
    offroadWarning.style.display = 'none';
    offroadWarningHideAt = 0;
  }
  if (detectedWarningHideAt && now > detectedWarningHideAt) {
    document.getElementById('detected-warning').style.display = 'none';
    detectedWarningHideAt = 0;
  }

  // --- 지도는 항상 자동차 위치를 중심으로, 북쪽 고정(bearing 0) ---
  map.jumpTo({ center: [car.lng, car.lat] });

  // --- 자동차 아이콘 자체를 heading만큼 회전 ---
  // --- 0/360도 경계에서 회전이 튀지 않도록, 화면 표시용 각도를 "최단 방향"으로 연속 갱신 ---
  let diff = car.heading - visualHeading;
  diff = ((diff + 180) % 360 + 360) % 360 - 180; // 항상 -180~180 사이의 최단 회전량으로 정규화
  visualHeading += diff;

  document.getElementById('car').style.transform = `rotate(${visualHeading}deg)`;
  // 원형 핸들 안의 바늘도 자동차와 항상 같은 방향을 가리키게 동기화
  wheelNeedle.style.transform = `translateY(-100%) rotate(${visualHeading}deg)`;

  // --- HUD 속도 표시 (m/s -> km/h), 현재 설정된 최고 전진속도도 함께 표시 ---
  hud.textContent = `속도: ${Math.round(Math.abs(car.speed) * 3.6)} / 최고 ${Math.round(car.maxForwardSpeed * 3.6)} km/h`;

  // --- 점수 갱신: 프레임 시작 위치 대비 "실제로" 이동한 거리만큼만 점수를 더한다 ---
  // (경찰을 피해 멈춰 서 있거나, 도로 밖으로 막혀서 못 나가거나, 그냥 정차 중이면 이동 거리가 0이라
  //  자동으로 점수가 오르지 않는다 - 별도의 "정차 감지" 로직이 필요 없다)
  const movedMeters = turf.distance(
    turf.point([scoreStartLng, scoreStartLat]), turf.point([car.lng, car.lat]), { units: 'meters' }
  );
  score += movedMeters / SCORE_METERS_PER_POINT;
  scoreHud.textContent = `점수: ${Math.floor(score)}`;

  // --- 경찰차 추격/체포 판정 갱신 ---
  updatePoliceCars(dt, now);

  requestAnimationFrame(gameLoop);
}

// 경찰차들의 이동을 처리한다.
// - patrol(순찰): 플레이어 위치를 전혀 모른 채, 도로를 따라 무작위로 방향을 바꾸며 천천히 순찰한다.
//   주변에 큰 초록 원(탐지 범위)을 표시하고, 플레이어가 그 안에 들어오면 "발각"되어 chase로 전환된다.
// - chase(추격): 발각된 상태로, 플레이어를 향해 (플레이어보다 느리지만) 빠르게 추격한다.
//   작은 빨간 원(체포 판정 범위) 안에 5초를 초과해서 머물면 체포된다.
// 두 상태 모두 도로 위 유지(하드 블록 포함)는 동일하게 적용된다.
function updatePoliceCars(dt, now) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  const policeChaseSpeed = car.maxForwardSpeed * POLICE_SPEED_FACTOR;   // 추격 중 최고 속도(플레이어보다 느림)
  const policePatrolSpeed = car.maxForwardSpeed * POLICE_PATROL_SPEED_FACTOR; // 순찰 중 속도(훨씬 느림)
  const maxTurn = POLICE_STEER_RATE_DEG_PER_SEC * dt;

  let playerInsideAnyCircle = false;

  // 이번 프레임에 추격 중인 경찰차가 여럿이어도 도로 그래프는 한 번만 만들어서 재사용한다(성능 보호).
  let cachedRoadGraph;
  let roadGraphBuilt = false;
  function getRoadGraphCached() {
    if (!roadGraphBuilt) {
      cachedRoadGraph = buildRoadGraph();
      roadGraphBuilt = true;
    }
    return cachedRoadGraph;
  }

  policeCars.forEach((pc) => {
    // 0) 발각 여부는 이번 프레임의 '이동을 마친 뒤'(최종 위치) 거리로 판정해야
    //    화면에 그려지는 초록 원과 정확히 일치한다. (아래 3번에서 위치 이동을 마친 뒤 다시 계산해서 사용)
    //    → 이동 전 위치로 미리 판정해버리면, 경찰차가 순찰하며 다가오는 도중
    //      "원이 화면상 아직 플레이어에 닿지 않았는데도 발각되는" 오차가 생긴다.
    let pendingDetect = false;

    // 1) 속도: 상태에 따라 다른 목표 속도를 향해 가속/감속
    const targetSpeed = pc.state === 'chase' ? policeChaseSpeed : policePatrolSpeed;
    if (pc.speed < targetSpeed) pc.speed = Math.min(targetSpeed, pc.speed + car.accel * dt);
    else if (pc.speed > targetSpeed) pc.speed = Math.max(targetSpeed, pc.speed - car.accel * dt);

    // 2) 조향: 추격 중이면 "도로를 따라가는 경로"의 다음 지점을 향해, 순찰 중이면 스스로 정한(무작위로 바뀌는) 순찰 방향을 향해 튼다
    let desiredBearing;
    if (pc.state === 'chase') {
      // 2-a) 경로가 없거나, 다 왔거나, 재계산 주기가 됐으면 새로 길찾기를 시도한다.
      pc.routeRecalcTimer -= dt;
      const needsNewRoute = !pc.route || pc.routeIndex >= pc.route.length || pc.routeRecalcTimer <= 0;
      if (needsNewRoute) {
        const graph = getRoadGraphCached();
        const path = graph ? findRoutePath(graph, pc.lng, pc.lat, car.lng, car.lat) : null;
        pc.route = path;       // 못 찾으면 null → 아래에서 기존 직선 추격으로 자동 대체됨(안전장치)
        pc.routeIndex = 0;
        pc.routeRecalcTimer = POLICE_ROUTE_RECALC_INTERVAL_SEC;
      }

      if (pc.route && pc.routeIndex < pc.route.length) {
        // 2-b) 지금 향하는 웨이포인트에 충분히 가까워졌으면 다음 웨이포인트로 넘어감(여러 개를 한 번에 지나칠 수도 있음)
        let target = pc.route[pc.routeIndex];
        let dToTarget = turf.distance(turf.point([pc.lng, pc.lat]), turf.point(target), { units: 'meters' });
        while (dToTarget <= POLICE_ROUTE_WAYPOINT_ARRIVE_M && pc.routeIndex < pc.route.length - 1) {
          pc.routeIndex++;
          target = pc.route[pc.routeIndex];
          dToTarget = turf.distance(turf.point([pc.lng, pc.lat]), turf.point(target), { units: 'meters' });
        }
        desiredBearing = turf.bearing(turf.point([pc.lng, pc.lat]), turf.point(target));
      } else {
        // 길찾기가 실패한 경우(도로 데이터 없음/그래프 끊김 등)에 한해서만, 기존처럼 플레이어를 향한 직선 방향을 사용
        desiredBearing = turf.bearing(turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]));
      }
    } else {
      pc.wanderTimer -= dt;
      if (pc.wanderTimer <= 0) {
        // 순찰 방향을 무작위로 새로 정함 (플레이어 위치와는 무관 - "전혀 내 위치를 모른 채" 돌아다님)
        pc.wanderHeading = pc.heading + (Math.random() * 2 - 1) * POLICE_WANDER_TURN_RANGE_DEG;
        pc.wanderTimer = POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC);
      }
      desiredBearing = pc.wanderHeading;
    }
    let hdiff = desiredBearing - pc.heading;
    hdiff = ((hdiff + 540) % 360) - 180;
    pc.heading = (pc.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

    // 3) 후보 위치를 계산한 뒤, 도로 위인지 확인해서 도로 밖이면 도로 쪽으로 조향을 보정한다.
    //    - 주변에 도로 정보가 아예 없는 경우(강/공터 등)에는 "마지막으로 도로 위였던 위치" 쪽으로 되돌아간다.
    //    - 많이 벗어난 경우(OFFROAD_HARD_BLOCK_METERS 초과)에는 방향만 바뀔 뿐 전진 자체를 막는다.
    let headingRad = pc.heading * Math.PI / 180;
    let candLat = pc.lat + (pc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
    let candLng = pc.lng + (pc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(candLat, candLng, OFFROAD_DETECT_RANGE_METERS);
    const onRoad = roadInfo && roadInfo.dist <= ROAD_HALF_WIDTH_METERS * 3;
    const hardBlocked = roadInfo && roadInfo.dist > OFFROAD_HARD_BLOCK_METERS;

    if (!onRoad) {
      const targetLng = roadInfo ? roadInfo.lng : pc.lastGoodLng;
      const targetLat = roadInfo ? roadInfo.lat : pc.lastGoodLat;
      const toRoadBearing = turf.bearing(turf.point([candLng, candLat]), turf.point([targetLng, targetLat]));
      let hd2 = toRoadBearing - pc.heading;
      hd2 = ((hd2 + 540) % 360) - 180;
      pc.heading = (pc.heading + Math.max(-maxTurn, Math.min(maxTurn, hd2)) + 360) % 360;

      if (hardBlocked) {
        candLat = pc.lat;
        candLng = pc.lng;
      } else {
        headingRad = pc.heading * Math.PI / 180;
        candLat = pc.lat + (pc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
        candLng = pc.lng + (pc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;
      }
    } else {
      pc.lastGoodLat = candLat;
      pc.lastGoodLng = candLng;
    }
    pc.lat = candLat;
    pc.lng = candLng;

    // 4) 체포 판정: "추격" 상태일 때만 유효 (순찰 중에는 근처를 지나가도 붙잡히지 않음)
    //    - 반드시 "이번 프레임 이동을 마친 뒤"의 최종 위치로 다시 거리 계산 → 화면에 그려지는 원과
    //      정확히 같은 기준으로 판정해서, 눈에 보이는 것보다 넓게 잡히는 오차를 없앤다.
    const distToPlayerAfterMove = turf.distance(
      turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
    );
    if (pc.state === 'chase' && distToPlayerAfterMove <= CATCH_RADIUS_METERS) {
      playerInsideAnyCircle = true;
    }
    // 순찰 중이었다면, 이동을 마친 최종 위치 기준으로 탐지 범위(초록 원) 안에
    // 플레이어가 실제로 들어왔는지 확인한다 → 이 값이 6번에서 그려지는 원과 완전히 동일한 기준.
    if (pc.state === 'patrol' && distToPlayerAfterMove <= POLICE_DETECTION_RADIUS_METERS) {
      pendingDetect = true;
    }

    // 5) 너무 오래 플레이어에게서 멀리 떨어져 있으면 재배치한다.
    //    - 추격 중: "무전 네트워크"로 다른 차가 앞쪽에 새로 나타나는 것처럼 재배치 (기존과 동일)
    //    - 순찰 중: 플레이어 근처에서 계속 순찰이 이루어지도록, 너무 멀어지면 근처로 다시 재배치
    const giveupDistance = pc.state === 'chase' ? POLICE_GIVEUP_DISTANCE_M : POLICE_PATROL_MAX_DIST_M;
    if (distToPlayerAfterMove > giveupDistance) {
      pc.farTimer += dt;
      if (pc.farTimer >= POLICE_GIVEUP_HOLD_SECONDS) {
        redeployPoliceCar(pc);
        return; // 재배치 직후이므로 이번 프레임의 아이콘/원 갱신은 다음 프레임에 정상적으로 이루어짐
      }
    } else {
      pc.farTimer = 0;
    }

    // 6) 화면 좌표로 변환해서 경찰차 아이콘과 원(순찰=탐지범위 / 추격=체포범위)의 위치·크기를 갱신
    const screenPt = map.project([pc.lng, pc.lat]);
    pc.el.style.transform = `translate(${screenPt.x - 7}px, ${screenPt.y - 12}px) rotate(${pc.heading}deg)`;

    const radiusMeters = pc.state === 'chase' ? CATCH_RADIUS_METERS : POLICE_DETECTION_RADIUS_METERS;
    const metersPerPixel = 156543.03392 * Math.cos(pc.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    const diameterPx = (2 * radiusMeters) / metersPerPixel;
    pc.circleEl.style.width = `${diameterPx}px`;
    pc.circleEl.style.height = `${diameterPx}px`;
    pc.circleEl.style.transform = `translate(${screenPt.x - diameterPx / 2}px, ${screenPt.y - diameterPx / 2}px)`;

    // 7) 원을 다 그린 뒤에야 비로소 실제 상태 전환을 적용한다.
    //    → 유저는 방금 6번에서 그려진 "초록 탐지 원이 자기 차를 감싸고 있는" 화면을 실제로 보게 되고,
    //      그 다음 프레임부터 추격(빨간 원)으로 바뀐다.
    if (pendingDetect) {
      triggerDetected(pc, now);
    }
  });

  // --- 체포 원 안에 "연속으로" 머문 시간을 누적하고, 기준 시간을 넘으면 체포 처리 ---
  const catchWarning = document.getElementById('catch-warning');
  if (playerInsideAnyCircle) {
    caughtTimer += dt;
    const remaining = Math.max(0, CATCH_HOLD_SECONDS - caughtTimer);
    catchWarning.style.display = 'block';
    catchWarning.textContent = `경찰에게 포위됨! ${remaining.toFixed(1)}초 후 체포`;
    if (caughtTimer >= CATCH_HOLD_SECONDS) triggerCaught();
  } else {
    caughtTimer = 0;
    catchWarning.style.display = 'none';
  }
}

// 순찰 중이던 경찰차가 플레이어를 "발각"했을 때 호출: 추격 상태로 전환하고, 사이렌 + 배너를 띄운다.
function triggerDetected(pc, now) {
  pc.state = 'chase';
  pc.circleEl.classList.remove('mode-patrol');
  pc.circleEl.classList.add('mode-chase');
  // 방금 추격을 시작했으므로, 다음 프레임에 곧바로 도로 기반 경로를 새로 계산하게 한다.
  pc.route = null;
  pc.routeIndex = 0;
  pc.routeRecalcTimer = 0;

  playSirenBeep();

  const el = document.getElementById('detected-warning');
  el.style.display = 'block';
  detectedWarningHideAt = now + DETECTED_WARNING_DURATION_MS;
}

// 짧은 사이렌 효과음을 Web Audio API로 직접 생성해서 재생한다(별도 음원 파일 불필요).
function playSirenBeep() {
  try {
    if (!window.__policeAudioCtx) {
      window.__policeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = window.__policeAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    const startAt = ctx.currentTime;
    const duration = 0.55;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(ctx.destination);

    // 사이렌 특유의 오르내리는 음(우~이~ 우~이~)을 흉내낸 주파수 변화
    osc.frequency.setValueAtTime(650, startAt);
    osc.frequency.linearRampToValueAtTime(1000, startAt + 0.14);
    osc.frequency.linearRampToValueAtTime(650, startAt + 0.28);
    osc.frequency.linearRampToValueAtTime(1000, startAt + 0.42);
    osc.frequency.linearRampToValueAtTime(650, startAt + 0.55);

    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.linearRampToValueAtTime(0.28, startAt + 0.03);
    gain.gain.linearRampToValueAtTime(0.0001, startAt + duration);

    osc.start(startAt);
    osc.stop(startAt + duration + 0.05);
  } catch (e) {
    // 오디오 재생이 막힌 환경(자동재생 제한 등)이면 조용히 무시하고 게임은 계속 진행
  }
}

// 플레이어를 너무 오래 놓친 경찰차를, 플레이어가 "가고 있는 방향" 앞쪽 어딘가로 재배치한다.
// (실제로는 같은 차량 객체를 옮기는 것이지만, 플레이어 입장에서는 "무전 받은 새 경찰차가 앞에 나타난 것"처럼 보인다)
function redeployPoliceCar(pc) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  // 플레이어의 현재 진행 방향(heading) 기준으로, 좌우로 약간 퍼진 각도 + 앞쪽 거리를 여러 번 시도해
  // "실제로 도로 위인" 지점을 찾는다.
  let lat = null, lng = null, bearingDeg = car.heading;
  for (let attempt = 0; attempt < 25; attempt++) {
    const angleOffset = (Math.random() * 2 - 1) * POLICE_RESPAWN_ANGLE_SPREAD_DEG;
    const tryBearing = car.heading + angleOffset;
    const tryDist = POLICE_RESPAWN_AHEAD_MIN_M + Math.random() * (POLICE_RESPAWN_AHEAD_MAX_M - POLICE_RESPAWN_AHEAD_MIN_M);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(tryLat, tryLng, 35);
    if (roadInfo) {
      lat = roadInfo.lat;
      lng = roadInfo.lng;
      bearingDeg = tryBearing;
      break;
    }
  }
  // 그래도 못 찾았으면, 마지막으로 도로 위였던 자기 위치를 그대로 유지한다 (건물/강 위로 순간이동하지 않도록)
  if (lat === null) {
    lat = pc.lastGoodLat;
    lng = pc.lastGoodLng;
  }

  pc.lat = lat;
  pc.lng = lng;
  pc.heading = bearingDeg;
  pc.speed = 0;       // 새로 배치된 것처럼 정지 상태에서 다시 가속 시작
  pc.farTimer = 0;
  pc.lastGoodLat = lat;
  pc.lastGoodLng = lng;

  // 재배치된 차량은 "새로 무전 받고 투입된" 것이므로, 플레이어 위치를 모르는 순찰 상태로 되돌린다.
  pc.state = 'patrol';
  pc.route = null;
  pc.routeIndex = 0;
  pc.routeRecalcTimer = 0;
  pc.wanderHeading = bearingDeg;
  pc.wanderTimer = POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC);
  pc.circleEl.classList.remove('mode-chase');
  pc.circleEl.classList.add('mode-patrol');
}

// 체포 확정: 모든 차량을 멈추고, "다시 도전하기" 버튼이 있는 오버레이를 띄운다.
function triggerCaught() {
  isCaught = true;
  car.speed = 0;
  policeCars.forEach((pc) => { pc.speed = 0; });
  document.getElementById('catch-warning').style.display = 'none';
  document.getElementById('caught-overlay').style.display = 'flex';
}

// 화면 위의 경찰차 DOM(아이콘 + 체포 원)을 모두 지우고, 배열도 비운다.
function clearPoliceCars() {
  policeCars.forEach((pc) => {
    pc.el.remove();
    pc.circleEl.remove();
  });
  policeCars = [];
  caughtTimer = 0;
}

// 페이지를 새로고침하지 않고, 지정된 위치/방향에서 게임을 다시 시작한다.
// (경찰차 초기화 → 자유 주행 카운트다운부터 다시 진행)
function restartGameAt(lat, lng, heading) {
  clearPoliceCars();

  car.lat = lat;
  car.lng = lng;
  car.heading = heading;
  car.speed = 0;
  throttleMode = 'forward';
  setThrottle('forward'); // 버튼 표시도 "전진"으로 동기화

  // 이탈 패널티 상태 초기화
  offroadPenaltyState = 'none';
  offroadPenaltyTimer = 0;
  wasOffRoad = false;

  // 붙잡혀서 다시 시작하는 것이므로 점수도 처음부터 다시 쌓는다
  score = 0;
  scoreHud.textContent = '점수: 0';

  document.getElementById('catch-warning').style.display = 'none';
  document.getElementById('caught-overlay').style.display = 'none';

  map.jumpTo({ center: [car.lng, car.lat] }); // 다음 프레임을 기다리지 않고 즉시 화면 중심을 옮김

  isCaught = false;
  startPoliceCountdown(); // 자유 주행 카운트다운부터 다시 시작 (gameLoop는 계속 돌고 있으므로 별도 재시작 불필요)
}

document.getElementById('restart-here-btn').addEventListener('click', () => {
  // 방금 붙잡힌 바로 그 위치에서 다시 시작
  restartGameAt(car.lat, car.lng, car.heading);
});

document.getElementById('restart-start-btn').addEventListener('click', () => {
  // 게임을 맨 처음 시작했던 위치/방향으로 되돌아가서 다시 시작
  restartGameAt(initialLat ?? car.lat, initialLng ?? car.lng, initialHeading);
});

document.getElementById('restart-main-btn').addEventListener('click', () => {
  // 완전히 처음(위치 권한 화면)으로: 페이지를 새로고침한다
  location.reload();
});

</script>
